name: Release Pipeline | CI/CD

on:
    push:
        branches: ["**"]
        tags: ["v*"]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: "3.13"
            - run: python -m pip install ruff==0.17.4
            - run: ruff check src tests
            - run: ruff format --check src tests

    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.10", "3.12", "3.14"]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: ${{ matrix.python-version }}
            - run: python -m pip install . pytest
            - run: python -m pytest

    build:
        needs: [lint, test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: "3.13"
            - run: python -m pip install build==1.6.1
            - run: python -m build
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: dist
                path: dist/
                if-no-files-found: error

    verify:
        needs: build
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: ["3.10", "3.12", "3.14"]
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                python-version: ${{ matrix.python-version }}
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                name: dist
                path: dist/
            - name: Install the wheel in a clean venv (path contains a space)
              run: |
                python -m venv "$RUNNER_TEMP/clean env"
                if [ "$RUNNER_OS" = "Windows" ]; then
                  BIN="$RUNNER_TEMP/clean env/Scripts"
                else
                  BIN="$RUNNER_TEMP/clean env/bin"
                fi
                "$BIN/python" -m pip install dist/*.whl
                "$BIN/python" -m pip check
                echo "BIN=$BIN" >> "$GITHUB_ENV"
            - name: Run the installed command and check its output
              working-directory: ${{ runner.temp }}
              run: |
                "$BIN/envcheck" --json > out.json
                "$BIN/python" -c "import json; assert 'python_version' in json.load(open('out.json'))"
                "$BIN/envcheck" > out.txt
                grep -q '^python_version: ' out.txt

    docker:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                name: dist
                path: dist/
            - run: docker build -t envcheck:ci .
            - run: docker run --rm envcheck:ci --json

    publish:
        needs: [verify, docker]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment: testpypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                name: dist
                path: dist/
            - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
              with:
                repository-url: https://test.pypi.org/legacy/
